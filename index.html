<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bulk Sender</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PapaParse for parsing CSV files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">WhatsApp Quick Sender</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Message Input -->
                        <div class="mb-3">
                            <label for="messageText" class="form-label font-weight-bold">Message Template</label>
                            <textarea class="form-control" id="messageText" rows="4" placeholder="Enter your message here..."></textarea>
                        </div>

                        <!-- CSV Upload -->
                        <div class="mb-4">
                            <label for="csvFile" class="form-label font-weight-bold">Upload CSV (Column header should be 'phone')</label>
                            <input class="form-control" type="file" id="csvFile" accept=".csv">
                            <div class="form-text">Make sure phone numbers include country codes (e.g., 9627XXXXXXXX).</div>
                        </div>

                        <!-- Preview Table -->
                        <div id="previewSection" class="d-none">
                            <h5>Loaded Contacts (<span id="contactCount">0</span>)</h5>
                            <div class="table-responsive mb-3" style="max-height: 300px; overflow-y: auto;">
                                <table class="table table-striped table-sm" id="contactsTable">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Phone Number</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Dynamic Rows -->
                                    </tbody>
                                </table>
                            </div>
                            <button class="btn btn-success w-100" id="startBtn">Start Sending Messages</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let contacts = [];

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    contacts = results.data;
                    displayContacts();
                }
            });
        });

        function displayContacts() {
            const tbody = document.querySelector('#contactsTable tbody');
            tbody.innerHTML = '';
            
            if (contacts.length === 0) {
                document.getElementById('previewSection').classList.add('d-none');
                return;
            }

            contacts.forEach((row, index) => {
                const phone = row.phone || row.Phone || Object.values(row)[0]; // Fallback to first column
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${phone}</td>
                    <td><a href="#" class="btn btn-sm btn-outline-success" onclick="sendMsg('${phone}', event)">Send</a></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('contactCount').textContent = contacts.length;
            document.getElementById('previewSection').classList.remove('d-none');
        }

        function sendMsg(phone, event) {
            if (event) event.preventDefault();
            const message = document.getElementById('messageText').value;
            const encodedMessage = encodeURIComponent(message);
            const cleanedPhone = phone.toString().replace(/\D/g, ''); // Remove non-numeric chars
            
            const url = `https://wa.me/${cleanedPhone}?text=${encodedMessage}`;
            window.open(url, '_blank');
        }

        document.getElementById('startBtn').addEventListener('click', function() {
            const message = document.getElementById('messageText').value;
            if (!message.trim()) {
                alert('Please enter a message first.');
                return;
            }

            // Loop through and open tabs sequentially with a slight user prompt or directly open first
            // Browsers block mass window.open(), so sequential clicking or manual row triggering is safest.
            alert('Due to browser popup blockers, click the "Send" button row by row, or allow popups for this site.');
        });
    </script>
</body>
</html>
