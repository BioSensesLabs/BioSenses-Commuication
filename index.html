<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Communication Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Upload Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navigation Header -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-brands fa-whatsapp text-2xl"></i> WA Broadcast Hub
            </h1>
            <nav class="flex gap-2">
                <button onclick="switchTab('templates')" id="nav-templates" class="px-4 py-2 rounded-lg bg-emerald-800 font-medium transition">Templates</button>
                <button onclick="switchTab('platform')" id="nav-platform" class="px-4 py-2 rounded-lg hover:bg-emerald-800 font-medium transition">Platform & Send</button>
                <button onclick="switchTab('transactions')" id="nav-transactions" class="px-4 py-2 rounded-lg hover:bg-emerald-800 font-medium transition">Transactions</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- ================= TAB 1: COMMUNICATION TEMPLATES ================= -->
        <section id="tab-templates" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 id="form-title" class="text-lg font-bold mb-4 text-emerald-800">Create New Template</h2>
                <form id="template-form" onsubmit="saveTemplate(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="template-id">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Template Category</label>
                        <select id="t-category" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="B2C">B2C</option>
                            <option value="B2B">B2B</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Template Title</label>
                        <input type="text" id="t-title" required placeholder="e.g., Promotional Discount" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Template Content (English)</label>
                        <textarea id="t-en" rows="3" required placeholder="Hello, enjoy your discount 🎉..." class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Template Content (Arabic)</label>
                        <textarea id="t-ar" dir="rtl" rows="3" required placeholder="مرحباً، استمتع بالخصم 🎉..." class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>
                    <div class="md:col-span-2 flex gap-3">
                        <button type="submit" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg hover:bg-emerald-700 font-medium transition">Save Template</button>
                        <button type="button" onclick="resetTemplateForm()" class="bg-gray-200 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-300 font-medium transition">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Templates Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">Defined Templates</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-4">Category</th>
                                <th class="p-4">Title</th>
                                <th class="p-4">English Content</th>
                                <th class="p-4">Arabic Content</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="templates-table-body" class="divide-y divide-gray-100 text-sm">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ================= TAB 2: COMMUNICATION PLATFORM ================= -->
        <section id="tab-platform" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Target Audience -->
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-emerald-800">1. Define Target Audience</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Enter Mobile Number(s)</label>
                        <textarea id="target-numbers" rows="3" placeholder="+9627XXXXXXXX (Comma or newline separated)" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Or Upload Excel File (.xlsx, .xls)</label>
                        <input type="file" id="excel-file" accept=".xlsx, .xls" onchange="handleExcelUpload(event)" class="w-full border rounded-lg p-2 file:bg-gray-100 file:border-0 file:p-2 file:mr-4 file:rounded-lg file:cursor-pointer">
                        <p class="text-xs text-gray-500 mt-1">Excel file should contain numbers in the first column.</p>
                    </div>
                </div>

                <!-- Template Selection & Editors -->
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-emerald-800">2. Select & Edit Message</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Choose Predefined Template</label>
                        <select id="platform-template-select" onchange="loadTemplateIntoPlatform()" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="">-- Select Template --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Content (English)</label>
                        <textarea id="platform-content-en" rows="2" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Content (Arabic)</label>
                        <textarea id="platform-content-ar" dir="rtl" rows="2" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>
                </div>

                <div class="md:col-span-2 border-t pt-4 flex justify-end">
                    <button onclick="sendMessages()" class="bg-emerald-600 text-white px-8 py-3 rounded-lg hover:bg-emerald-700 font-bold transition flex items-center gap-2">
                        <i class="fa-brands fa-whatsapp text-xl"></i> Send WhatsApp Messages
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= TAB 3: TRANSACTIONS ================= -->
        <section id="tab-transactions" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                    <h2 class="text-lg font-bold text-emerald-800">Message Logs & Transactions</h2>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="search-tx" onkeyup="renderTransactions()" placeholder="Search mobile or title..." class="border rounded-lg px-3 py-2 text-sm w-full md:w-64 focus:ring-2 focus:ring-emerald-500 outline-none">
                        <select id="filter-tx" onchange="renderTransactions()" class="border rounded-lg px-3 py-2 text-sm outline-none">
                            <option value="">All Templates</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-4">Mobile Number</th>
                                <th class="p-4">Template Title</th>
                                <th class="p-4">Date & Time</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-table-body" class="divide-y divide-gray-100 text-sm">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Application Script Logic -->
    <script>
        // State Management stored in localStorage
        let templates = JSON.parse(localStorage.getItem('wa_templates')) || [];
        let transactions = JSON.parse(localStorage.getItem('wa_transactions')) || [];
        let uploadedNumbers = [];
        let activeQueue = [];

        // Tab Switching Mechanism
        function switchTab(tabId) {
            ['templates', 'platform', 'transactions'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('bg-emerald-800');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('bg-emerald-800');
            
            if(tabId === 'platform') updatePlatformDropdown();
            if(tabId === 'transactions') updateTransactionFilters();
        }

        // --- TEMPLATES LOGIC ---
        function saveTemplate(e) {
            e.preventDefault();
            const id = document.getElementById('template-id').value;
            const category = document.getElementById('t-category').value;
            const title = document.getElementById('t-title').value;
            const contentEn = document.getElementById('t-en').value;
            const contentAr = document.getElementById('t-ar').value;

            if (id) {
                // Edit mode
                const index = templates.findIndex(t => t.id == id);
                if (index > -1) {
                    templates[index] = { id: Number(id), category, title, contentEn, contentAr };
                }
            } else {
                // Create mode
                const newTemplate = { id: Date.now(), category, title, contentEn, contentAr };
                templates.push(newTemplate);
            }

            localStorage.setItem('wa_templates', JSON.stringify(templates));
            resetTemplateForm();
            renderTemplates();
        }

        function renderTemplates() {
            const tbody = document.getElementById('templates-table-body');
            tbody.innerHTML = '';
            if (templates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No templates defined yet.</td></tr>`;
                return;
            }
            templates.forEach(t => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-semibold"><span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded text-xs">${t.category}</span></td>
                        <td class="p-4 font-medium text-gray-900">${t.title}</td>
                        <td class="p-4 text-gray-600 truncate max-w-xs">${t.contentEn}</td>
                        <td class="p-4 text-gray-600 truncate max-w-xs" dir="rtl">${t.contentAr}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="editTemplate(${t.id})" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteTemplate(${t.id})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function editTemplate(id) {
            const t = templates.find(item => item.id === id);
            if (!t) return;
            document.getElementById('template-id').value = t.id;
            document.getElementById('t-category').value = t.category;
            document.getElementById('t-title').value = t.title;
            document.getElementById('t-en').value = t.contentEn;
            document.getElementById('t-ar').value = t.contentAr;
            document.getElementById('form-title').innerText = "Edit Template";
        }

        function deleteTemplate(id) {
            if(confirm("Are you sure you want to delete this template?")) {
                templates = templates.filter(t => t.id !== id);
                localStorage.setItem('wa_templates', JSON.stringify(templates));
                renderTemplates();
            }
        }

        function resetTemplateForm() {
            document.getElementById('template-form').reset();
            document.getElementById('template-id').value = '';
            document.getElementById('form-title').innerText = "Create New Template";
        }

        // --- PLATFORM LOGIC ---
        function updatePlatformDropdown() {
            const select = document.getElementById('platform-template-select');
            select.innerHTML = '<option value="">-- Select Template --</option>';
            templates.forEach(t => {
                select.innerHTML += `<option value="${t.id}">${t.title} (${t.category})</option>`;
            });
        }

        function loadTemplateIntoPlatform() {
            const id = document.getElementById('platform-template-select').value;
            const t = templates.find(item => item.id == id);
            if(t) {
                document.getElementById('platform-content-en').value = t.contentEn;
                document.getElementById('platform-content-ar').value = t.contentAr;
            } else {
                document.getElementById('platform-content-en').value = '';
                document.getElementById('platform-content-ar').value = '';
            }
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                
                uploadedNumbers = [];
                json.forEach(row => {
                    if(row[0]) uploadedNumbers.push(String(row[0]).trim());
                });
                alert(`Successfully extracted ${uploadedNumbers.length} numbers from Excel file.`);
            };
            reader.readAsArrayBuffer(file);
        }

        function sendMessages() {
            const manualInput = document.getElementById('target-numbers').value.trim();
            const templateId = document.getElementById('platform-template-select').value;
            const contentEn = document.getElementById('platform-content-en').value;
            const contentAr = document.getElementById('platform-content-ar').value;

            if(!templateId) {
                alert("Please select a template first.");
                return;
            }

            let manualNumbers = manualInput ? manualInput.split(/[\n,]+/).map(n => n.trim()).filter(n => n) : [];
            let allNumbers = [...new Set([...manualNumbers, ...uploadedNumbers])];

            if(allNumbers.length === 0) {
                alert("Please provide at least one mobile number manually or upload an Excel file.");
                return;
            }

            const selectedTemplate = templates.find(t => t.id == templateId);
            
            // Properly encode full UTF-8 strings (including emojis and Arabic characters) for URLs
            const rawMessage = `${contentEn}\n\n${contentAr}`;
            const combinedMessage = encodeURIComponent(rawMessage).replace(/%0A/g, '%0A');

            // Build queue data
            activeQueue = allNumbers.map(num => ({
                mobile: num,
                title: selectedTemplate.title,
                message: combinedMessage
            }));

            runNextInQueue();
        }

        function runNextInQueue() {
            if (activeQueue.length === 0) {
                alert("All messages in the queue have been processed and logged!");
                renderTransactions();
                return;
            }

            const current = activeQueue.shift();
            const cleanNumber = current.mobile.replace(/[^0-9]/g, '');

            // Log transaction immediately
            const dateStr = new Date().toLocaleString();
            transactions.unshift({
                mobile: current.mobile,
                title: current.title,
                date: dateStr
            });
            localStorage.setItem('wa_transactions', JSON.stringify(transactions));

            // Open WhatsApp chat
            window.open(`https://wa.me/${cleanNumber}?text=${current.message}`, '_blank');

            // Prompt sequence for the next chat
            setTimeout(() => {
                if(confirm(`Chat opened for ${current.mobile}.\n\nClick OK to open the next chat in the queue (${activeQueue.length} remaining).`)) {
                    runNextInQueue();
                }
            }, 500);

            if(activeQueue.length === 0) {
                document.getElementById('target-numbers').value = '';
                uploadedNumbers = [];
                document.getElementById('excel-file').value = '';
            }
        }

        // --- TRANSACTIONS LOGIC ---
        function updateTransactionFilters() {
            const filterSelect = document.getElementById('filter-tx');
            filterSelect.innerHTML = '<option value="">All Templates</option>';
            templates.forEach(t => {
                filterSelect.innerHTML += `<option value="${t.title}">${t.title}</option>`;
            });
            renderTransactions();
        }

        function renderTransactions() {
            const tbody = document.getElementById('transactions-table-body');
            const searchVal = document.getElementById('search-tx').value.toLowerCase();
            const filterVal = document.getElementById('filter-tx').value;
            
            tbody.innerHTML = '';
            
            let filtered = transactions.filter(tx => {
                const matchesSearch = tx.mobile.toLowerCase().includes(searchVal) || tx.title.toLowerCase().includes(searchVal);
                const matchesFilter = filterVal === "" || tx.title === filterVal;
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">No transaction records found.</td></tr>`;
                return;
            }

            filtered.forEach(tx => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-mono text-gray-800">${tx.mobile}</td>
                        <td class="p-4 font-medium text-emerald-800">${tx.title}</td>
                        <td class="p-4 text-gray-500">${tx.date}</td>
                    </tr>
                `;
            });
        }

        // Initial Page Load
        renderTemplates();
    </script>
</body>
</html>
